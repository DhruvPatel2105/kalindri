<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
</helmet>
<div style="font-family:'Libre Franklin',Helvetica,sans-serif;width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:14px">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
    <button type="button" onClick="{{ onCut }}" style="font:inherit;font-size:14px;font-weight:500;color:#1e2a2a;background:#ffffff;border:1px solid #cfccc2;border-radius:4px;padding:0 22px;height:38px;min-width:150px;cursor:pointer" style-hover="background:#f2f6f5;border-color:#1f6f6b;color:#1f6f6b" style-active="background:#e4eeec">Cut</button>
    <button type="button" onClick="{{ onCopy }}" style="font:inherit;font-size:14px;font-weight:500;color:#1e2a2a;background:#ffffff;border:1px solid #cfccc2;border-radius:4px;padding:0 22px;height:38px;min-width:150px;cursor:pointer" style-hover="background:#f2f6f5;border-color:#1f6f6b;color:#1f6f6b" style-active="background:#e4eeec">Copy</button>
    <button type="button" onClick="{{ onPaste }}" style="font:inherit;font-size:14px;font-weight:500;color:#1e2a2a;background:#ffffff;border:1px solid #cfccc2;border-radius:4px;padding:0 22px;height:38px;min-width:150px;cursor:pointer" style-hover="background:#f2f6f5;border-color:#1f6f6b;color:#1f6f6b" style-active="background:#e4eeec">Paste</button>
  </div>
  <div style="display:flex;align-items:baseline;gap:10px;min-height:20px">
    <span style="font-size:14px;font-weight:600;color:#3d4a48">Total Word Count:</span>
    <span style="{{ countStyle }}">{{ words }}</span>
    <span style="{{ hintStyle }}">{{ hint }}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:720,&quot;height&quot;:110},&quot;targetSelector&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#kalindri-response&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;minWords&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;min&quot;:0,&quot;max&quot;:200,&quot;tsType&quot;:&quot;number&quot;},&quot;maxWords&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;min&quot;:0,&quot;max&quot;:400,&quot;tsType&quot;:&quot;number&quot;},&quot;onWordCount&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(n: number) =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { words: 0, hint: '' };
  get target() {
    const sel = this.props.targetSelector;
    return sel ? document.querySelector(sel) : null;
  }
  componentDidMount() {
    this.onInput = () => this.count();
    const el = this.target;
    if (el) el.addEventListener('input', this.onInput);
    this.count();
  }
  componentWillUnmount() {
    const el = this.target;
    if (el) el.removeEventListener('input', this.onInput);
    clearTimeout(this.ht);
  }
  count() {
    const el = this.target;
    const txt = el ? el.value : (this.props.text ?? '');
    const w = txt.trim() ? txt.trim().split(/\s+/).length : 0;
    this.setState({ words: w });
    if (this.props.onWordCount) this.props.onWordCount(w);
  }
  flash(msg) {
    if (!msg) return;
    this.setState({ hint: msg });
    clearTimeout(this.ht);
    this.ht = setTimeout(() => this.setState({ hint: '' }), 2600);
  }
  selection(el) {
    const s = el.selectionStart, e = el.selectionEnd;
    return s !== e ? { s, e, text: el.value.slice(s, e) } : { s: 0, e: el.value.length, text: el.value };
  }
  async write(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (err) { return false; }
  }
  renderVals() {
    const act = (fn) => async () => {
      const el = this.target;
      if (!el) { this.flash('No text field connected'); return; }
      await fn(el);
      this.count();
    };
    const low = this.props.minWords ?? 0;
    const high = this.props.maxWords ?? 0;
    const banded = low > 0 && high > 0;
    const out = banded && (this.state.words < low || this.state.words > high);
    return {
      words: this.state.words,
      hint: this.state.hint,
      countStyle: {
        fontFamily: "'IBM Plex Mono',monospace", fontSize: '15px', fontWeight: 500,
        color: out ? '#8a5a12' : '#1e2a2a',
        background: out ? '#fbf3e3' : 'transparent',
        border: '1px solid ' + (out ? '#e6d3aa' : 'transparent'),
        borderRadius: '3px', padding: '1px 8px'
      },
      hintStyle: { fontSize: '13px', color: '#8a6420', marginLeft: '4px' },
      onCut: act(async (el) => {
        const { s, e, text } = this.selection(el);
        const ok = await this.write(text);
        el.setRangeText('', s, e, 'end');
        el.focus();
        this.flash(ok ? '' : 'Cut locally — clipboard blocked by browser');
      }),
      onCopy: act(async (el) => {
        const { text } = this.selection(el);
        const ok = await this.write(text);
        el.focus();
        this.flash(ok ? 'Copied' : 'Clipboard blocked by browser');
      }),
      onPaste: act(async (el) => {
        try {
          const txt = await navigator.clipboard.readText();
          const s = el.selectionStart, e = el.selectionEnd;
          el.setRangeText(txt, s, e, 'end');
          el.focus();
        } catch (err) {
          el.focus();
          this.flash('Browser blocked paste — use Ctrl+V');
        }
      })
    };
  }
}
</script>
</body>
</html>
