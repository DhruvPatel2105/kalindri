<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
</helmet>
<div style="font-family:'Libre Franklin',Helvetica,sans-serif;display:flex;flex-direction:column;gap:14px;width:100%;box-sizing:border-box">
  <div style="border-left:3px solid #1f6f6b;background:#fafaf8;padding:26px 30px">
    <p style="margin:0;font-size:19px;line-height:2.2;color:#283634">
      <sc-for list="{{ tokens }}" as="t" hint-placeholder-count="48">
        <span onClick="{{ t.onClick }}" style="{{ t.style }}">{{ t.text }} </span>
      </sc-for>
    </p>
  </div>
  <div style="display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap">
    <span style="font-size:13px;color:#7d8a88">Click a word to mark it. Click again to unmark.</span>
    <span style="font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;color:#1f6f6b">{{ countLabel }}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:300},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Click any word in this transcript to mark it as incorrect.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(picked: number[]) =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { picked: [] };
  renderVals() {
    const text = this.props.text ?? '';
    const words = text.split(/\s+/).filter(Boolean);
    const picked = this.state.picked;
    return {
      countLabel: picked.length + (picked.length === 1 ? ' word marked' : ' words marked'),
      tokens: words.map((w, i) => {
        const on = picked.includes(i);
        return {
          text: w,
          onClick: () => {
            const next = on ? picked.filter((x) => x !== i) : picked.concat(i);
            this.setState({ picked: next });
            if (this.props.onChange) this.props.onChange(next);
          },
          style: {
            cursor: 'pointer', padding: '2px 3px', borderRadius: '3px',
            fontWeight: on ? 600 : 400,
            color: on ? '#7d2f1c' : '#283634',
            background: on ? '#f6dfd6' : 'transparent',
            borderBottom: on ? '2px solid #b0472f' : '2px solid transparent'
          }
        };
      })
    };
  }
}
</script>
</body>
</html>
