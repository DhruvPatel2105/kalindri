<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
</helmet>
<div style="font-family:'Libre Franklin',Helvetica,sans-serif;display:grid;grid-template-columns:190px 1fr 230px;gap:20px;align-items:center;width:100%;box-sizing:border-box">
  <span style="font-size:15px;font-weight:500;color:#1e2a2a">{{ nameText }}</span>
  <div style="height:10px;border-radius:5px;background:#eeebe3;overflow:hidden">
    <div style="{{ fillStyle }}"></div>
  </div>
  <div style="display:flex;align-items:baseline;gap:10px">
    <span style="font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:500;color:#1e2a2a">{{ scoreLabel }}</span>
    <span style="font-size:13px;line-height:1.5;color:#5c6a68">{{ descriptor }}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:660,&quot;height&quot;:40},&quot;nameText&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Grammar&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;score&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;min&quot;:0,&quot;max&quot;:10,&quot;tsType&quot;:&quot;number&quot;},&quot;max&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:2,&quot;min&quot;:1,&quot;max&quot;:10,&quot;tsType&quot;:&quot;number&quot;},&quot;descriptor&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Two sentence-boundary errors&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const score = this.props.score ?? 0;
    const max = Math.max(1, this.props.max ?? 2);
    const ratio = score / max;
    return {
      scoreLabel: score + '/' + max,
      fillStyle: {
        height: '100%', borderRadius: '5px',
        width: ratio * 100 + '%',
        background: ratio < 0.6 ? '#b58b2a' : '#1f6f6b'
      }
    };
  }
}
</script>
</body>
</html>
