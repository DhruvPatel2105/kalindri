<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600&display=swap" rel="stylesheet" />
</helmet>
<div style="font-family:'Libre Franklin',Helvetica,sans-serif;display:flex;flex-direction:column;gap:10px;width:100%;box-sizing:border-box">
  <sc-for list="{{ rows }}" as="opt" hint-placeholder-count="4">
    <div onClick="{{ opt.onToggle }}" style="{{ opt.rowStyle }}">
      <div style="{{ opt.markStyle }}">
        <span style="{{ opt.glyphStyle }}">{{ opt.glyph }}</span>
      </div>
      <span style="font-size:12px;font-weight:600;letter-spacing:0.08em;color:#7d8a88;width:14px;flex:0 0 auto;padding-top:3px">{{ opt.letter }}</span>
      <span style="font-size:16px;line-height:1.55;color:#1e2a2a">{{ opt.text }}</span>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:760,&quot;height&quot;:230},&quot;options&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;},&quot;multi&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(picked: number[]) =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { picked: [] };
  renderVals() {
    const options = this.props.options ?? ['Option one', 'Option two', 'Option three', 'Option four'];
    const multi = this.props.multi ?? false;
    const letters = 'ABCDEFGH'.split('');
    const picked = this.state.picked;
    return {
      rows: options.map((text, i) => {
        const on = picked.includes(i);
        return {
          text, letter: letters[i],
          glyph: multi ? '✓' : '●',
          onToggle: () => {
            const next = multi
              ? (on ? picked.filter((x) => x !== i) : picked.concat(i))
              : [i];
            this.setState({ picked: next });
            if (this.props.onChange) this.props.onChange(next);
          },
          rowStyle: {
            display: 'flex', alignItems: 'flex-start', gap: '14px', cursor: 'pointer',
            padding: '14px 18px', borderRadius: '4px',
            border: '1px solid ' + (on ? '#1f6f6b' : '#ddd9d0'),
            background: on ? '#eaf2f1' : '#ffffff'
          },
          markStyle: {
            width: '18px', height: '18px', flex: '0 0 auto', marginTop: '3px',
            borderRadius: multi ? '3px' : '50%',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            border: '1px solid ' + (on ? '#1f6f6b' : '#b9b5aa'),
            background: on && multi ? '#1f6f6b' : '#ffffff'
          },
          glyphStyle: {
            fontSize: multi ? '12px' : '10px', lineHeight: 1,
            color: multi ? '#ffffff' : '#1f6f6b', opacity: on ? 1 : 0
          }
        };
      })
    };
  }
}
</script>
</body>
</html>
