<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600&display=swap" rel="stylesheet" />
</helmet>
<div style="font-family:'Libre Franklin',Helvetica,sans-serif;display:flex;align-items:center;gap:16px;width:100%;box-sizing:border-box">
  <span style="font-size:13px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:#5c6a68;flex:0 0 auto">Volume</span>
  <div ref="{{ trackRef }}" onPointerDown="{{ onTrackDown }}" style="position:relative;flex:1 1 auto;height:26px;display:flex;align-items:center;cursor:pointer;touch-action:none">
    <div style="position:absolute;left:0;right:0;top:11px;height:4px;border-radius:2px;background:#e4e1d8"></div>
    <div style="{{ volFillStyle }}"></div>
    <div style="position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between">
      <sc-for list="{{ ticks }}" as="tick" hint-placeholder-count="11">
        <div style="width:1px;height:5px;background:#c9c5ba"></div>
      </sc-for>
    </div>
    <div style="{{ handleStyle }}"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:60},&quot;volume&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.55,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(v: number) =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { volume: 0.55, dragging: false };
  constructor(p) { super(p); this.trackRef = React.createRef(); }
  componentDidMount() {
    this.setState({ volume: this.props.volume ?? 0.55 });
    this.onUp = () => this.setState({ dragging: false });
    this.onMove = (e) => { if (this.state.dragging) this.setVol(e); };
    window.addEventListener('pointerup', this.onUp);
    window.addEventListener('pointermove', this.onMove);
  }
  componentDidUpdate(prev) {
    if (prev.volume !== this.props.volume && typeof this.props.volume === 'number') {
      this.setState({ volume: this.props.volume });
    }
  }
  componentWillUnmount() {
    window.removeEventListener('pointerup', this.onUp);
    window.removeEventListener('pointermove', this.onMove);
  }
  setVol(e) {
    const el = this.trackRef.current;
    if (!el) return;
    const r = el.getBoundingClientRect();
    const v = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    this.setState({ volume: v });
    if (this.props.onChange) this.props.onChange(v);
  }
  renderVals() {
    const vp = this.state.volume * 100;
    return {
      ticks: Array.from({ length: 11 }, (_, i) => i),
      trackRef: this.trackRef,
      onTrackDown: (e) => { this.setState({ dragging: true }); this.setVol(e); },
      volFillStyle: { position: 'absolute', left: 0, top: '11px', height: '4px', borderRadius: '2px', background: '#1f6f6b', width: vp + '%' },
      handleStyle: { position: 'absolute', top: '4px', left: 'calc(' + vp + '% - 9px)', width: '18px', height: '18px', borderRadius: '50%', background: '#1f6f6b', border: '2px solid #ffffff', boxShadow: '0 1px 3px rgba(30,42,42,0.35)' }
    };
  }
}
</script>
</body>
</html>
