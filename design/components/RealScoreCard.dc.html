<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
</helmet>
<div style="font-family:'Libre Franklin',Helvetica,sans-serif;background:#fafaf8;border:1px solid #e6e2d9;border-radius:4px;padding:22px 26px;width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:18px">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap">
    <div style="display:flex;flex-direction:column;gap:5px;min-width:0">
      <span style="font-size:16px;font-weight:600;color:#1e2a2a">Sat the real test? Add your official scores.</span>
      <span style="font-size:13.5px;line-height:1.6;color:#5c6a68;max-width:620px">Your official numbers recalibrate your own estimates — the ranges above get narrower and truer for you specifically.</span>
    </div>
    <button type="button" onClick="{{ toggle }}" style="font-family:'Libre Franklin',Helvetica,sans-serif;font-size:14px;font-weight:600;color:#1f6f6b;background:#ffffff;border:1px solid #cfccc2;border-radius:4px;height:40px;padding:0 22px;cursor:pointer;white-space:nowrap" style-hover="background:#f2f6f5;border-color:#1f6f6b">{{ toggleLabel }}</button>
  </div>

  <div style="{{ formStyle }}">
    <div style="height:1px;background:#e6e2d9"></div>
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px">
      <sc-for list="{{ fields }}" as="f" hint-placeholder-count="4">
        <label style="display:flex;flex-direction:column;gap:7px">
          <span style="font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#7d8a88">{{ f.label }}</span>
          <input type="number" min="10" max="90" placeholder="10&ndash;90" style="font-family:'IBM Plex Mono',monospace;font-size:16px;color:#1e2a2a;background:#ffffff;border:1px solid #cfccc2;border-radius:3px;padding:10px 12px;width:100%;box-sizing:border-box;outline:none" style-focus="border-color:#1f6f6b;box-shadow:0 0 0 3px rgba(31,111,107,0.12)" />
        </label>
      </sc-for>
    </div>
    <div style="display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap">
      <label style="display:flex;flex-direction:column;gap:7px">
        <span style="font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#7d8a88">Test date</span>
        <input type="date" style="font-family:'Libre Franklin',Helvetica,sans-serif;font-size:15px;color:#1e2a2a;background:#ffffff;border:1px solid #cfccc2;border-radius:3px;padding:9px 12px;outline:none" style-focus="border-color:#1f6f6b;box-shadow:0 0 0 3px rgba(31,111,107,0.12)" />
      </label>
      <button type="button" onClick="{{ save }}" style="font-family:'Libre Franklin',Helvetica,sans-serif;font-size:15px;font-weight:600;color:#ffffff;background:#1f6f6b;border:1px solid #1f6f6b;border-radius:4px;height:44px;padding:0 28px;cursor:pointer" style-hover="background:#17544f;border-color:#17544f">{{ saveLabel }}</button>
      <span style="font-size:13px;line-height:1.6;color:#7d8a88;max-width:340px">Only you and your instructor see these.</span>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1040,&quot;height&quot;:120}}">
class Component extends DCLogic {
  state = { open: false, saved: false };
  renderVals() {
    return {
      fields: [
        { label: 'Listening' }, { label: 'Reading' },
        { label: 'Speaking' }, { label: 'Writing' }
      ],
      toggleLabel: this.state.open ? 'Cancel' : 'Add scores',
      saveLabel: this.state.saved ? 'Saved \u2014 estimates recalibrated' : 'Save my official scores',
      toggle: () => this.setState((s) => ({ open: !s.open, saved: false })),
      save: () => this.setState({ saved: true }),
      formStyle: {
        display: this.state.open ? 'flex' : 'none',
        flexDirection: 'column', gap: '20px'
      }
    };
  }
}

</script>
</body>
</html>
